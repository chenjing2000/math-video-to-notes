[project]
name = "video-to-notes"
version = "1.2.6"
description = "Visual-first course video reconstruction pipeline for structured lecture notes."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PyYAML>=6.0.2,<7",
    "Pillow>=10.4.0,<13",
    "numpy>=2.0.0,<3",
    "faster-whisper>=1.1.0,<2",
    "Jinja2>=3.1.4,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
]

[project.scripts]
video-to-notes = "video_to_notes.cli:main"

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["video_to_notes*"]

[tool.setuptools.package-data]
"video_to_notes.resources" = ["*.yaml", "*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
markers = [
    "integration: end-to-end or multi-module integration tests",
]
